      <circle cx="86.512" cy="-4.914" r="3.2"/><circle cx="10.988" cy="38.689" r="3.2"/>
    </g>
    <g font-family="Georgia, serif" font-size="17" fill="#173d36">
      <text x="-91" y="25">F₁</text><text x="80" y="24">F₂</text>
      <text x="92" y="-10">A</text><text x="14" y="57">B</text>
    </g>
  </g>
  <g transform="translate(369 99)">
