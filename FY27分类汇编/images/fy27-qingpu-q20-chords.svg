  <rect x="251" y="1" width="236" height="184" rx="12" fill="#fcfdf9" stroke="#cedbd2"/>
  <g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#173d36">
    <text x="119" y="28">过右焦点的弦</text>
    <text x="369" y="28">竖直弦 x = 1</text>
  </g>
  <g transform="translate(119 99)">
